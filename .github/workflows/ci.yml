name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint e testes (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Testes (pytest)
        run: pytest

  integration:
    name: Integração com pgvector
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: clarus
          POSTGRES_PASSWORD: clarus
          POSTGRES_DB: clarus_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clarus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CLARUS_TEST_DB_HOST: localhost
      CLARUS_TEST_DB_PORT: "5432"
      CLARUS_TEST_DB_USER: clarus
      CLARUS_TEST_DB_PASSWORD: clarus
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Instalar dependências
        run: pip install -r requirements-dev.txt
      - name: Testes de integração
        run: pytest tests/test_integration_pgvector.py -rs

  docker:
    name: Build da imagem Docker
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t clarus:ci .
